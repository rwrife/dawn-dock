name: Documentation integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate staged documentation baseline
        run: python3 scripts/check_docs.py
      - name: Validate component selection artifacts
        run: python3 scripts/check_component_selection.py

      - name: Build KiCad 9 verifier
        run: docker build -t dawn-kicad-verify -f hardware/kicad/Dockerfile.verify hardware/kicad
      - name: Derive and validate schematic evidence
        run: |
          mkdir -p "$RUNNER_TEMP/dawn-kicad"
          docker run --rm \
            -e KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD9_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -v "$PWD:/work" -v "$RUNNER_TEMP/dawn-kicad:/out" \
            -w /work/hardware/kicad dawn-kicad-verify \
            sch erc --output /out/erc.rpt --exit-code-violations dawn-dock.kicad_sch
          docker run --rm \
            -e KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD9_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -v "$PWD:/work" -v "$RUNNER_TEMP/dawn-kicad:/out" \
            -w /work/hardware/kicad dawn-kicad-verify \
            sch export netlist --output /out/dawn-dock.net dawn-dock.kicad_sch
          docker run --rm \
            -e KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD9_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -v "$PWD:/work" -v "$RUNNER_TEMP/dawn-kicad:/out" \
            -w /work/hardware/kicad dawn-kicad-verify \
            sch export bom dawn-dock.kicad_sch --output /out/bom.csv \
            --fields 'Reference,${QUANTITY},Value,Footprint,Manufacturer,MPN,Supplier,Supplier PN,Estimated Unit Cost USD,Price Observed UTC,BOM Comments,${DNP}' \
            --labels 'Reference,Qty,Value,Footprint,Manufacturer,MPN,Supplier,Supplier_PN,Estimated_Unit_Cost_USD,Price_Observed_UTC,Notes,DNP' \
            --group-by 'Value,Footprint,Manufacturer,MPN,Supplier,Supplier PN,Estimated Unit Cost USD,Price Observed UTC,BOM Comments,${DNP}' \
            --sort-field Reference --sort-asc
          cmp bom/bom.csv "$RUNNER_TEMP/dawn-kicad/bom.csv"
          python3 hardware/kicad/validate_hardware.py \
            --netlist "$RUNNER_TEMP/dawn-kicad/dawn-dock.net" \
            --bom "$RUNNER_TEMP/dawn-kicad/bom.csv" \
            --erc "$RUNNER_TEMP/dawn-kicad/erc.rpt" \
            --output "$RUNNER_TEMP/dawn-kicad/hardware-validation.json"
      - name: Derive and validate PCB evidence
        run: |
          docker run --rm \
            -e KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD9_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -v "$PWD:/work" -v "$RUNNER_TEMP/dawn-kicad:/out" \
            -w /work/hardware/kicad dawn-kicad-verify \
            pcb drc --format json --output /out/drc.json \
            --exit-code-violations dawn-dock.kicad_pcb
          docker run --rm \
            -v "$PWD:/work" -v "$RUNNER_TEMP/dawn-kicad:/out" \
            -w /work --entrypoint python3 dawn-kicad-verify \
            hardware/kicad/export_fabrication.py \
            --board hardware/kicad/dawn-dock.kicad_pcb --output /out/fab
          cmp hardware/kicad/fabrication/rev-a0-prototype-review/dawn-dock-rev-a0-gerbers-review-only.zip \
            "$RUNNER_TEMP/dawn-kicad/fab/dawn-dock-rev-a0-gerbers-review-only.zip"
          cmp hardware/kicad/fabrication/rev-a0-prototype-review/dawn-dock-rev-a0-position.csv \
            "$RUNNER_TEMP/dawn-kicad/fab/dawn-dock-rev-a0-position.csv"
          (cd hardware/kicad/fabrication/rev-a0-prototype-review && \
            sha256sum --check SHA256SUMS && \
            python3 -m zipfile --test dawn-dock-rev-a0-gerbers-review-only.zip)
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("hardware/kicad/fabrication/rev-a0-prototype-review")
          reports = Path("hardware/kicad/reports")

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          for report_name, source in (
              ("schematic-analysis.json", "hardware/kicad/dawn-dock.kicad_sch"),
              ("pcb.json", "hardware/kicad/dawn-dock.kicad_pcb"),
          ):
              primary = json.loads((reports / report_name).read_text())
              assert digest(source) in primary["inputs"]["source_hashes"].values()

          for report_name in ("cross-analysis.json", "emc.json", "thermal.json"):
              downstream = json.loads((reports / report_name).read_text())
              for source, expected in downstream["inputs"]["source_hashes"].items():
                  assert digest(source) == expected, (report_name, source, expected, digest(source))

          report = json.loads((reports / "gerber.json").read_text())
          with zipfile.ZipFile(artifact / "dawn-dock-rev-a0-gerbers-review-only.zip") as archive:
              for source, expected in report["inputs"]["source_hashes"].items():
                  member = source.split("/rev-a0-prototype-review/", 1)[1]
                  actual = hashlib.sha256(archive.read(member)).hexdigest()
                  assert actual == expected, (member, expected, actual)
          PY
      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native firmware tests
        run: cmake -S firmware/host -B build/firmware-host -G "Unix Makefiles"
      - name: Build native firmware tests
        run: cmake --build build/firmware-host --parallel
      - name: Run native firmware tests
        run: ctest --test-dir build/firmware-host --output-on-failure

  firmware-esp-idf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable ESP-IDF verifier
        run: docker build -t dawn-dock-idf-verify -f firmware/Dockerfile.verify firmware
      - name: Cross-build ESP32-S3 firmware in disposable source copy
        run: |
          mkdir -p "$RUNNER_TEMP/dawn-firmware"
          cp -a firmware/. "$RUNNER_TEMP/dawn-firmware/"
          docker run --rm \
            -v "$RUNNER_TEMP/dawn-firmware:/project" -w /project \
            dawn-dock-idf-verify idf.py set-target esp32s3 build
          test -s "$RUNNER_TEMP/dawn-firmware/build/dawn_dock_firmware.bin"
