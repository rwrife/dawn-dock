name: Documentation integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate staged documentation baseline
        run: python3 scripts/check_docs.py
      - name: Validate component selection artifacts
        run: python3 scripts/check_component_selection.py
      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
